    <script>
      // Early global error catcher to prevent benign sandbox HMR / WebSocket notices from causing overlay alerts
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('websocket') !== -1 ||
            reason.indexOf('[vite]') !== -1 ||
            reason.indexOf('closed without opened') !== -1 ||
            reason.indexOf('The play() request was interrupted') !== -1 ||
            reason.indexOf('AudioContext was not allowed') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
